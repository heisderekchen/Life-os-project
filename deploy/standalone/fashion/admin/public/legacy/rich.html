t-size:12px}.workspace{min-width:0}.topbar{position:sticky;top:0;z-index:4;display:flex;align-items:center;justify-content:space-between;min-height:76px;padding:0 clamp(22px,4vw,56px);border-bottom:1px solid rgba(23,32,42,.08);background:rgba(244,245,243,.8);backdrop-filter:blur(15px) saturate(1.2);-webkit-backdrop-filter:blur(15px) saturate(1.2)}.topbar h1{font-size:17px}.account{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:13px}.text-button{border:0;padding:7px 0;color:inherit;background:transparent;text-decoration:underline;text-decoration-color:#c1c9cd;text-underline-offset:4px}.text-button:hover{color:var(--ink)}.mobile-nav{display:none}.main{max-width:1420px;margin:0 auto;padding:clamp(26px,4vw,54px)}.page-title{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:27px}.page-title h2{font-size:clamp(29px,3vw,41px);letter-spacing:-.06em}.page-title>p{max-width:43ch;color:var(--muted);font-size:14px}.lead-layout{display:grid;grid-template-columns:minmax(250px,300px) minmax(0,1fr);gap:clamp(24px,4vw,58px);align-items:start}.lead-rail{position:sticky;top:106px}.lead-rail-head{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:12px;border-bottom:1px solid var(--line)}.lead-rail h3{font-size:14px}.lead-total{color:var(--muted);font-size:12px}.lead-row{position:relative;width:100%;border:0;border-bottom:1px solid var(--line);padding:17px 26px 17px 0;color:var(--ink);background:transparent;text-align:left}.lead-row:hover strong{color:var(--accent)}.lead-row:after{position:absolute;top:26px;right:4px;width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);content:"";transform:rotate(-45deg)}.lead-row[aria-expanded=true]:after{top:24px;border-color:var(--accent);transform:rotate(45deg)}.lead-row strong{display:block;font-size:15px;letter-spacing:-.015em}.lead-row small{display:block;margin-top:3px;color:var(--muted);font-size:12px}.lead-type{displa rial-toggle:hover{border-color:var(--ink);background:#f0f2f1}.material-review{display:grid;grid-template-columns:minmax(0,1fr) 205px;gap:18px;margin-top:18px;padding:18px;border-left:2px solid var(--accent);background:#faf9f7}.material-review p{color:#374754;font-size:13px;line-height:1.7}.review-actions{display:grid;gap:9px;align-content:start}.decision{min-height:38px;border:1px solid #cbd2d5;border-radius:8px;padding:7px 10px;color:#33404b;background:#fff;text-align:left;font-size:13px;transition:border .16s,background .16s}.decision:hover{border-color:var(--ink)}.decision[aria-pressed=true]{border-color:var(--accent);color:#7e2c22;background:var(--accent-pale);font-weight:700}.review-note{width:100%;min-height:78px;margin-top:13px;border:1px solid #cbd2d5;border-radius:8px;padding:9px 10px;color:var(--ink);background:#fff;resize:vertical}.review-note:focus{border-color:var(--focus);box-shadow:0 0 0 3px rgba(22,95,193,.13)}.save-line{display:flex;align-items:center;gap:10px;margin-top:10px}.primary{min-height:39px;padding:0 14px;font-size:13px}.saved{color:var(--good);font-size:12px;font-weight:700}.lead-review{display:grid;grid-template-columns:120px minmax(0,1fr);gap:20px;margin-top:30px;padding:28px 0;border-top:2px solid var(--ink)}.lead-review h4{font-size:16px}.lead-review .review-actions{grid-template-columns:repeat(3,minmax(0,1fr))}.workflow{max-width:920px}.flow-intro{max-width:61ch;margin-bottom:34px;color:#374754;font-size:17px;line-height:1.75}.flow-line{border-top:2px solid var(--ink)}.flow-step{display:grid;grid-template-columns:140px minmax(0,1fr);gap:20px;padding:22px 0;border-bottom:1px solid var(--line)}.flow-step strong{font-size:15px}.flow-step span{color:var(--muted);font-size:14px}@media(max-width:900px){.login{grid-template-columns:1fr}.login-art{min-height:35vh;padding:32px}.login-art h1{max-width:none;font-size:52px}.login-copy{display:none}.app{grid-template-columns:190px minmax(0,1fr)}.main{padding:28px}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.lead-layout{grid-template-columns:220px minmax(0,1fr)}}@media(max-width:680px){.login-art{min-height:31vh;padding:26px}.login-art h1{font-size:46px}.login-panel{display:block;padding:42px 24px}.login-form{margin:auto}.app{display:block}.sidebar{display:none}.topbar{min-height:64px;padding:0 18px}.topbar h1{font-size:15px}.account{gap:10px;font-size:12px}.switch{display:none}.mobile-nav{position:sticky;top:64px;z-index:3;display:flex;border-bottom:1px solid var(--line);background:rgba(244,245,243,.92);backdrop-filter:blur(14px)}.mobile-nav button{flex:1;min-height:47px;border:0;border-bottom:2px solid transparent;color:var(--muted);background:transparent;font-size:13px}.mobile-nav button[aria-current=true]{border-bottom-color:var(--accent);color:var(--ink);font-weight:700}.main{padding:26px 18px}.page-title{display:block;margin-bottom:20px}.page-title>p{margin-top:8px}.lead-layout{display:block}.lead-rail{position:static}.lead-detail{margin-top:28px}.lead-header{grid-template-columns:1fr}.facts{gap:18px 12px}.finding{display:block;padding:23px 0}.finding p{margin-top:10px;font-size:15px}.material{grid-template-columns:92px minmax(0,1fr);gap:14px}.material-image{width:92px}.material-title{font-size:15px}.material-toggle{margin-top:12px}.material-review{grid-column:1/-1;display:block;margin-top:0;padding:15px}.review-actions{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:14px}.decision{min-height:42px;padding:6px;font-size:12px;text-align:center}.lead-review{display:block}.lead-review h4{margin-bottom:14px}.lead-review .review-actions{grid-template-columns:1fr}.flow-step{grid-template-columns:1fr;gap:5px}}

<body>
<div class="app" id="app" hidden><aside class="sidebar"><div class="brand">时尚情报平台</div><div class="nav-label">工作台</div><button class="nav-button" data-view="leads" aria-current="true">线索评估</button><button class="nav-button" data-view="flow" aria-current="false">情报工作流程</button><div class="sidebar-foot">以线索为单位整理<br>以素材为依据判断</div></aside><div class="workspace"><header class="topbar"><h1>时尚情报平台</h1><div class="account"><span id="identity"></span><button class="text-button switch" id="switch">切换账号</button><button class="text-button" id="logout">退出</button></div></header><nav class="mobile-nav"><button data-view="leads" aria-current="true">线索评估</button><button data-view="flow" aria-current="false">工作流程</button></nav><main class="main"><section id="leads-view"><div class="page-title"><div><p class="eyebrow">情报工作台</p><h2>线索评估</h2></div><p>每一条线索先说明发生了什么，再查看它带来的素材，并分别做出判断。</p></div><div class="lead-layout"><aside class="lead-rail"><div class="lead-rail-head"><h3>线索列表</h3><span class="lead-total" id="lead-total"></span></div><div id="lead-list"></div></aside><div id="lead-detail"></div></div></section><section id="flow-view" hidden><div class="page-title"><div><p class="eyebrow">协作结构</p><h2>情报工作流程</h2></div></div><div class="workflow"><p class="flow-intro">线索决定要查什么；任务和渠道决定怎么找；核实后的情报才进入设计判断。</p><div class="flow-line"><div class="flow-step"><strong>时尚线索</strong><span>热点事件、新品系列、穿搭风格、设计元素或市场变化。</span></div><div class="flow-step"><strong>查找任务</strong><span>把线索拆成可核实的问题：品牌、系列、鞋型、时间、来源和细节。</span></div><div class="flow-step"><strong>渠道获取</strong><span>从公开官网、发布会、主办方、媒体和已验证账号取得素材并去重。</span></div><div class="flow-step"><strong>线索评估</strong><span>先判断整条线索的开发价值，再对每一份关联素材单独记录判断。</span></div></div></div></section></main></div></div>
<script src="local-api.js"></script><script src="data.js"></script><script>
(()=>{const root=document,data=window.MIU_SAMPLE,leadId='miu-ss27';const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const accounts={};const leads=[{id:leadId,type:'时尚热点事件',title:'Miu Miu 2027 春夏发布',meta:'Miu Miu · 2027 春夏',date:'2026 年 10 月 4 日',status:'已核实'}];let account=null,openLead=leadId,openAsset=null;function now(){return accounts[account]||(accounts[account]={})}function fb(scope,id){const x=now();x[scope]||={};return x[scope][id]||{decision:null,note:''}}function put(scope,id,v){now()[scope]||={};now()[scope][id]=v}function options(key,f){return [['candidate','值得开发'],['watch','继续研究'],['pass','暂不跟进']].map(([v,t])=>'<button class="decision" data-choice="'+key+'" data-value="'+v+'" aria-pressed="'+(f.decision===v)+'">'+t+'</button>').join('')}function view(v){root.querySelector('#leads-view').hidden=v!=='leads';root.querySelector('#flow-view').hidden=v!=='flow';root.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.view===v)))}function list(){root.querySelector('#lead-total').textContent=leads.length+' 条';root.querySelector('#lead-list').innerHTML=leads.map(l=>'<button class="lead-row" data-lead="'+l.id+'" aria-expanded="'+(openLead===l.id)+'"><strong>'+e(l.title)+'</strong><small>'+e(l.meta)+' · '+e(l.date)+'</small><span class="lead-type">'+e(l.type)+' · '+data.items.length+' 项素材</span></button>').join('');root.querySelectorAll('[data-lead]').forEach(b=>b.onclick=()=>{openLead=openLead===b.dataset.lead?null:b.dataset.lead;openAsset=null;render()})}function detail(){const h=root.querySelector('#lead-detail');if(!openLead){h.innerHTML='<p class="quiet">选择一条线索查看详情。</p>';return}const lead=leads[0],lf=fb('leads',leadId);h.innerHTML='<article class="lead-detail"><header class="lead-header"><div><p class="eyebrow">'+e(lead.type)+'</p><h3>'+e(lead.title)+'</h3><p>'+e(lead.meta)+'</p></div><span class="status">'+e(lead.status)+'</span></header><dl class="facts"><div><dt>品牌 / 系列</dt><dd>Miu Miu · 2027 春夏</dd></div><div><dt>事件日期</dt><dd>2026 年 10 月 4 日</dd></div><div><dt>线索来源</dt><dd>品牌官网 / FHCM 主办方</dd></div><div><dt>素材核实</dt><dd>公开来源与鞋图已核对</dd></div></dl><section class="finding"><h4>线索发现</h4><div><p>发现两组鞋履参考：运动鞋的对比配色与系带细节，以及乐福鞋的鳞纹外观和系结装饰。</p><div class="sources"><a href="https://www.miumiu.com/us/en/miumiu-club/fashion-shows/ss27-fashion-show.html" target="_blank" rel="noopener">查看品牌发布</a><a href="https://www.fhcm.paris/en/collection/miu-miu-womenswear-springsummer-2027" target="_blank" rel="noopener">核对事件来源</a></div></div></section><section><div class="materials-head"><h4>关联素材</h4><span>'+data.items.length+' 项</span></div><div class="material-list">'+data.items.map(x=>{const f=fb('materials',x.id),open=openAsset===x.id;return '<article class="material"><img class="material-image" src="'+e(x.image)+'" alt="'+e(x.title)+'"><div class="material-main"><h4 class="material-title">'+e(x.title)+'</h4><p class="material-tags">'+x.tags.map(e).join(' · ')+'</p><button class="material-toggle" data-toggle="'+e(x.id)+'" aria-expanded="'+open+'">'+(open?'收起素材评估':'评估素材')+'</button></div>'+(open?'<div class="material-review"><div><p>'+e(x.description)+'</p><textarea class="review-note" data-note="material:'+e(x.id)+'" maxlength="2000" placeholder="记录这份素材的判断">'+e(f.note)+'</textarea><div class="save-line"><button class="primary" data-save="material:'+e(x.id)+'">保存素材评估</button><span class="saved" aria-live="polite"></span></div></div><div class="review-actions">'+options('material:'+x.id,f)+'</div></div>':'')+'</article>'}).join('')+'</div></section><section class="lead-review"><h4>线索评估</h4><div><div class="review-actions">'+options('lead:'+leadId,lf)+'</div><textarea class="review-note" data-note="lead:'+leadId+'" maxlength="2000" placeholder="记录这条线索的整体判断">'+e(lf.note)+'</textarea><div class="save-line"><button class="primary" data-save="lead:'+leadId+'">保存线索评估</button><span class="saved" aria-live="polite"></span></div></div></section></article>';h.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{openAsset=openAsset===b.dataset.toggle?null:b.dataset.toggle;detail()});h.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const [kind,id]=b.dataset.choice.split(':'),scope=kind==='lead'?'leads':'materials',f=fb(scope,id);f.decision=f.decision===b.dataset.value?null:b.dataset.value;put(scope,id,f);h.querySelectorAll('[data-choice="'+b.dataset.choice+'"]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.value===f.decision)))});h.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{const [kind,id]=b.dataset.save.split(':'),scope=kind==='lead'?'leads':'materials',f=fb(scope,id);f.note=h.querySelector('[data-note="'+b.dataset.save+'"]').value;put(scope,id,f);b.nextElementSibling.textContent='已保存'})}function render(){list();detail()}root.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));const exit=async()=>{root.querySelector('#app').hidden=true;try{await fetch('/api/logout',{method:'POST',headers:{accept:'application/json'}})}catch{}location.replace('/login')};root.querySelector('#switch').onclick=exit;root.querySelector('#logout').onclick=exit;(async()=>{try{const response=await fetch('/api/session',{headers:{accept:'application/json'},cache:'no-store'});const state=await response.json().catch(()=>({}));if(!response.ok||!state.authenticated){location.replace('/login?next='+encodeURIComponent(location.pathname+location.search));return}account=typeof state.username==='string'?state.username:'';root.querySelector('#identity').textContent=account;root.querySelector('#app').hidden=false;window.fashionSession={username:account,logout:exit};render();view('leads');window.dispatchEvent(new CustomEvent('fashion:session-ready'))}catch{location.replace('/login')}})()})();
