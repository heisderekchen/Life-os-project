<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>来源管理 · 时尚工作台</title><link rel="stylesheet" href="/fashion-admin/admin.css"></head><body>
<aside class="sidebar"><a class="brand" href="/fashion/">时尚工作台</a><div class="sidebar-section">设置</div><nav id="categories" aria-label="来源分类"></nav><div class="sidebar-foot">来源管理 · 本机管理端</div><a href="/fashion-admin/legacy/rich.html">旧版资料与配置</a><a href="/fashion-admin/migration.html">导入旧版资料</a></aside>
<div class="workspace"><header class="topbar"><span>设置 / 来源管理</span><button id="refresh" type="button">刷新数据</button></header><main><div class="heading"><div><h1>来源管理</h1><p>管理来源分类、优先级与审核记录。</p></div><button id="export" type="button" class="primary">导出配置</button></div><div class="summary" id="summary" aria-live="polite">正在读取来源…</div>
<form class="filters" id="filters" role="search"><label class="search">搜索来源<input id="query" type="search" placeholder="名称、域名、标签或国家地区" autocomplete="off"></label><label>访问状态<select id="access"><option value="">全部访问状态</option><option value="accessible">首页可访问</option><option value="restricted">访问 / 采集受限</option></select></label><label>审核状态<select id="review"><option value="">全部审核状态</option><option value="pending">待整理</option><option value="retain">保留</option><option value="exclude">排除</option></select></label><label>优先级<select id="priority"><option value="">全部优先级</option><option value="high">优先</option><option value="normal">常规</option><option value="reserve">备用</option></select></label></form>
<div class="filter-foot"><label><input id="shoes" type="checkbox">鞋履目录或首页鞋履线索</label><span id="result-count" aria-live="polite"></span></div>
<p class="state-note">审核保留用于整理接入清单；检索接入需另行验证。访问检查与素材更新、图片可用性分开记录。</p><p id="load-error" role="alert" hidden></p>
<div class="table-wrap"><table><thead><tr><th scope="col">来源</th><th scope="col">主分类 / 标签</th><th scope="col">国家地区</th><th scope="col">访问状态</th><th scope="col">审核</th><th scope="col">优先级</th><th scope="col">检索接入</th><th scope="col"><span class="sr-only">操作</span></th></tr></thead><tbody id="rows"></tbody></table><p id="empty" class="empty" hidden>没有符合条件的来源</p></div>
<nav class="pagination" aria-label="来源分页"><button id="previous" type="button" disabled>上一页</button><span id="page-info"></span><button id="next" type="button" disabled>下一页</button></nav></main></div>
<dialog id="editor" aria-labelledby="editor-title"><form id="edit-form"><div class="editor-head"><h2 id="editor-title">编辑来源</h2><button id="close" type="button">关闭</button></div><div class="editor-body"><a id="source-link" target="_blank" rel="noopener noreferrer"></a><p id="source-meta"></p><label>主分类<select name="category" required></select></label><label>标签<input name="tags" placeholder="以逗号分隔，例如：鞋履、材质、女装" maxlength="300"></label><div class="editor-pair"><label>审核状态<select name="review" required></select></label><label>优先级<select name="priority" required></select></label></div><label>核查备注<textarea name="note" rows="5" maxlength="2000" placeholder="记录保留或排除理由、关注内容及访问问题"></textarea></label><details class="evidence"><summary>发现依据与原始分类</summary><p id="original-category"></p><div id="evidence-links"></div></details><p class="state-note">接入状态、访问记录与原始出处由核查流程产生，不随手动审核改变。</p><p class="error" id="save-error" role="alert"></p></div><div class="editor-actions"><button id="cancel" type="button">取消</button><button id="save" type="submit" class="primary">保存配置</button></div></form></dialog><div id="notice" class="notice" role="status" aria-live="polite"></div><script type="module" src="/fashion-admin/admin.js"></script></body></html>
