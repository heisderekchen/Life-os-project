name: Life OS Standalone Verification

on:
  push:
    branches: [main, codex/standalone-deployment]
  pull_request:
    branches: [main, codex/standalone-deployment]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy this verified main commit after verification.
        type: boolean
        required: false
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: lifeos-standalone-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: file:./prisma/ci.db
      LIFEOS_BASE_PATH: /workbench
      NEXT_PUBLIC_LIFEOS_BASE_PATH: /workbench
      AUTH_SECRET: ci-only-not-a-deploy-secret
      PERSONAL_WORKBENCH_ENTRY_KEY: ci-only-not-a-deploy-key
      LIFEOS_DOMAIN: lifeos.example
      LIFEOS_RECURRENCE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - name: Install Chromium for mobile viewport verification
        run: bunx playwright install --with-deps chromium
      - name: Verify mobile task list height, scrolling, and desktop labels
        run: bunx playwright test --config=playwright.mobile.config.ts e2e/mobile-task-queue.spec.ts
      - name: Upload mobile viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-task-queue-visual
          path: test-results/**
          if-no-files-found: warn
          retention-days: 7
      - name: Package portable Node 24 runtime
        run: bash deploy/standalone/scripts/build-node-bundle.sh /tmp/lifeos-standalone-node.tar.gz
      - name: Publish portable Node 24 runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-node-runtime-${{ github.sha }}
          path: |
            /tmp/lifeos-standalone-node.tar.gz
            /tmp/lifeos-standalone-node.tar.gz.sha256
          retention-days: 7
      - name: Run synthetic loopback acceptance on the packaged runtime
        run: bash deploy/standalone/scripts/loopback-acceptance.sh /tmp/lifeos-standalone-node.tar.gz
      - run: node --test deploy/standalone/fashion/test/*.test.mjs
      - run: node --check deploy/standalone/server.mjs
      - run: node --check deploy/standalone/session.mjs
      - run: node --check deploy/standalone/src/platform-auth.mjs
      - run: node --check deploy/standalone/src/personal-workbench.mjs
      - run: node --check deploy/standalone/agent-bridge.mjs
      - run: node --check deploy/standalone/src/task-cards.mjs
      - run: node --check deploy/standalone/src/research.mjs
      - run: node deploy/standalone/scripts/test-runtime.mjs
      - run: node deploy/standalone/scripts/test-platform-migration.mjs
      - run: node deploy/standalone/scripts/test-http.mjs
      - run: node deploy/standalone/scripts/test-platform-http.mjs
      - run: node deploy/standalone/scripts/test-owner-password-setup.mjs
      - run: node --check deploy/standalone/scripts/initialize-owner-password.mjs
      - run: node deploy/standalone/scripts/test-task-import.mjs
      - run: node deploy/standalone/scripts/test-task-cards.mjs
      - run: node deploy/standalone/scripts/test-task-cards-http.mjs
      - run: node deploy/standalone/scripts/test-research.mjs
      - run: node deploy/standalone/scripts/test-research-http.mjs
      - run: sh deploy/standalone/scripts/test-run-node-path.sh
      - run: python3 deploy/standalone/scripts/test-sqlite-tools.py
      - run: node deploy/standalone/scripts/test-agent-bridge.mjs
      - run: bash deploy/standalone/scripts/test-deploy-node-release.sh
      - name: Validate deployment Compose configuration
        run: docker compose -f deploy/standalone/docker-compose.yml config --quiet
      - run: npm ci --prefix agent-service
      - run: npm test --prefix agent-service
      - uses: docker/setup-buildx-action@v3
      - name: Build deployable image artifact
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          tags: lifeos-standalone:${{ github.sha }}
          outputs: type=docker,dest=/tmp/lifeos-standalone.tar
      - name: Build private AI service image artifact
        uses: docker/build-push-action@v6
        with:
          context: ./agent-service
          file: ./agent-service/Dockerfile
          platforms: linux/amd64
          push: false
          tags: lifeos-agent:${{ github.sha }}
          outputs: type=docker,dest=/tmp/lifeos-agent.tar
      - name: Hash deployable build archives
        run: cd /tmp && sha256sum lifeos-standalone.tar lifeos-agent.tar lifeos-standalone-node.tar.gz > lifeos-images.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: lifeos-standalone-${{ github.sha }}
          path: |
            /tmp/lifeos-standalone.tar
            /tmp/lifeos-agent.tar
            /tmp/lifeos-standalone-node.tar.gz
            /tmp/lifeos-standalone-node.tar.gz.sha256
            /tmp/lifeos-images.sha256
          retention-days: 7

  deploy:
    name: Deploy verified Node release
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.LIFEOS_AUTODEPLOY_ENABLED == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy_production))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: lifeos-production
    concurrency:
      group: lifeos-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lifeos-node-runtime-${{ github.sha }}
          path: /tmp/lifeos-node-runtime
      - name: Verify commit and package manifests
        id: package
        shell: bash
        run: |
          set -euo pipefail
          bundle=/tmp/lifeos-node-runtime/lifeos-standalone-node.tar.gz
          sha_file="$bundle.sha256"
          test -s "$bundle"
          test -s "$sha_file"
          (cd /tmp/lifeos-node-runtime && sha256sum -c lifeos-standalone-node.tar.gz.sha256)
          expected_commit="$GITHUB_SHA"
          [[ "$expected_commit" =~ ^[a-f0-9]{40}$ ]]
          staging=$(mktemp -d)
          trap 'rm -rf "$staging"' EXIT
          tar -xzf "$bundle" -C "$staging"
          grep -qx "source_commit=$expected_commit" "$staging/VERSION"
          (cd "$staging" && sha256sum -c MANIFEST.sha256)
          digest=$(sha256sum "$bundle" | cut -d' ' -f1)
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
      - name: Deploy over pinned SSH
        shell: bash
        env:
          PACKAGE_SHA256: ${{ steps.package.outputs.sha256 }}
          LIFEOS_SSH_HOST: ${{ vars.LIFEOS_SSH_HOST }}
          LIFEOS_SSH_USER: ${{ vars.LIFEOS_SSH_USER }}
          LIFEOS_SSH_PORT: ${{ vars.LIFEOS_SSH_PORT || '22' }}
          LIFEOS_SYSTEMD_UNIT: ${{ vars.LIFEOS_SYSTEMD_UNIT }}
          LIFEOS_HEALTH_URL: ${{ vars.LIFEOS_HEALTH_URL }}
          LIFEOS_SSH_PRIVATE_KEY: ${{ secrets.LIFEOS_SSH_PRIVATE_KEY }}
          LIFEOS_SSH_KNOWN_HOSTS: ${{ secrets.LIFEOS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${LIFEOS_SSH_HOST:?Set the lifeos-production host variable}"
          : "${LIFEOS_SSH_USER:?Set the lifeos-production user variable}"
          : "${LIFEOS_SSH_PRIVATE_KEY:?Set the lifeos-production SSH key secret}"
          : "${LIFEOS_SSH_KNOWN_HOSTS:?Set the pinned lifeos-production known-hosts secret}"
          : "${LIFEOS_SYSTEMD_UNIT:?Set the actual systemd unit variable}"
          : "${LIFEOS_HEALTH_URL:?Set the actual local health URL variable}"
          [[ "$LIFEOS_SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$LIFEOS_SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]*$ ]]
          [[ "$LIFEOS_SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          LIFEOS_SSH_PORT=$((10#$LIFEOS_SSH_PORT))
          (( LIFEOS_SSH_PORT > 0 && LIFEOS_SSH_PORT < 65536 ))
          [[ "$LIFEOS_SYSTEMD_UNIT" =~ ^[A-Za-z0-9_.@-]+$ ]]
          [[ "$LIFEOS_HEALTH_URL" =~ ^http://(127\.0\.0\.1|localhost)(:[0-9]{1,5})?/[A-Za-z0-9._~/-]*$ ]]
          [[ "$PACKAGE_SHA256" =~ ^[a-f0-9]{64}$ ]]

          key_file="$RUNNER_TEMP/lifeos-deploy-key"
          known_hosts_file="$RUNNER_TEMP/lifeos-known-hosts"
          umask 077
          printf '%s\n' "$LIFEOS_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$LIFEOS_SSH_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          pinned_host="$LIFEOS_SSH_HOST"
          if [[ "$LIFEOS_SSH_PORT" != 22 ]]; then
            pinned_host="[$LIFEOS_SSH_HOST]:$LIFEOS_SSH_PORT"
          fi
          ssh-keygen -F "$pinned_host" -f "$known_hosts_file" >/dev/null

          printf -v remote_command 'sudo -n /usr/local/sbin/lifeos-deploy-release %q %q %q %q' \
            "$GITHUB_SHA" "$PACKAGE_SHA256" "$LIFEOS_SYSTEMD_UNIT" "$LIFEOS_HEALTH_URL"
          ssh \
            -i "$key_file" \
            -p "$LIFEOS_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_file" \
            -o GlobalKnownHostsFile=/dev/null \
            "${LIFEOS_SSH_USER}@${LIFEOS_SSH_HOST}" \
            "$remote_command" \
            < /tmp/lifeos-node-runtime/lifeos-standalone-node.tar.gz
